<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colheita de Água</title>

<!-- PWA / iPhone "Add to Home Screen" -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A4B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colheita Água">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#F6F2EA;
    --surface:#FFFFFF;
    --ink:#16302E;
    --ink-soft:#4A605E;
    --teal:#0E6B66;
    --teal-dark:#0A4B47;
    --foam:#D9EFEA;
    --foam-line:#BFE3DD;
    --coral:#E2673F;
    --coral-soft:#FBE4DB;
    --tag-bg:#16302E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Courier New",monospace;}

  header.topbar{
    position:sticky;top:0;z-index:20;
    background:var(--teal-dark);
    color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-top,0px)) 16px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 10px rgba(10,40,38,0.15);
  }
  header.topbar .back{
    background:none;border:none;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer;line-height:1;
  }
  header.topbar h1{
    font-size:17px;margin:0;font-weight:650;letter-spacing:0.2px;flex:1;
  }
  header.topbar .eyebrow{
    font-size:11px;opacity:0.75;letter-spacing:0.6px;text-transform:uppercase;display:block;margin-top:2px;
  }

  main{padding:16px 16px 100px 16px;max-width:560px;margin:0 auto;}

  /* Wave / tide badge */
  .tide-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:0.2px;}
  .tide-baixa{background:#EFE9D8;color:#8A6B1E;}
  .tide-preia{background:var(--foam);color:var(--teal-dark);}
  .tide-enchente{background:#E1EFF6;color:#1E5E8A;}
  .tide-vazante{background:#F3E7E0;color:#8A4A1E;}
  .tide-badge svg{width:16px;height:12px;display:block;}

  /* Location cards */
  .loc-card{
    background:var(--surface);
    border-radius:16px;
    padding:14px;
    margin-bottom:12px;
    display:flex;gap:12px;align-items:center;
    box-shadow:0 1px 3px rgba(20,50,45,0.08);
    border:1px solid rgba(20,50,45,0.06);
    cursor:pointer;
  }
  .loc-card:active{transform:scale(0.99);}
  .loc-thumb{
    width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--foam);
  }
  .loc-thumb.placeholder{display:flex;align-items:center;justify-content:center;font-size:22px;}
  .loc-info{flex:1;min-width:0;}
  .loc-info .name{font-weight:650;font-size:15.5px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .loc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .frasco-count{font-size:12.5px;color:var(--ink-soft);}
  .chev{color:var(--ink-soft);font-size:20px;flex-shrink:0;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .empty-state .wave-big{width:64px;height:48px;margin:0 auto 14px auto;display:block;opacity:0.6;}
  .empty-state p{margin:4px 0;font-size:14.5px;}

  /* FAB */
  .fab{
    position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:58px;height:58px;border-radius:50%;
    background:var(--teal);color:#fff;border:none;
    font-size:28px;box-shadow:0 6px 16px rgba(14,107,102,0.4);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:15;
  }
  .fab:active{background:var(--teal-dark);}

  /* Forms */
  label.field-label{display:block;font-size:13px;font-weight:650;color:var(--ink-soft);margin:18px 0 7px 0;text-transform:uppercase;letter-spacing:0.4px;}
  input[type=text], select{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #DAD3C4;
    background:var(--surface);font-size:16px;color:var(--ink);
  }
  input[type=text]:focus, select:focus{outline:none;border-color:var(--teal);}

  .name-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .name-chip{
    border:1.5px solid #DAD3C4;border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);background:var(--surface);cursor:pointer;
  }
  .name-chip.selected{border-color:var(--teal);background:var(--foam);color:var(--teal-dark);}
  .name-chip.add-new{border-style:dashed;}

  .tide-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tide-option{
    border:1.5px solid #DAD3C4;border-radius:12px;padding:10px 8px;text-align:center;
    background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .tide-option svg{width:26px;height:18px;}
  .tide-option.selected{border-color:var(--teal);background:var(--foam);color:var(--teal-dark);}

  .photo-btn{
    width:100%;border:1.5px dashed #B9C9C5;border-radius:12px;background:var(--surface);
    padding:18px;text-align:center;color:var(--teal-dark);font-weight:600;font-size:14.5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .photo-btn svg{width:26px;height:26px;}
  .photo-preview-wrap{position:relative;}
  .photo-preview{width:100%;border-radius:12px;display:block;max-height:260px;object-fit:cover;}
  .retake{
    position:absolute;top:8px;right:8px;background:rgba(22,48,46,0.75);color:#fff;
    border:none;border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer;
  }

  .btn-primary{
    width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:16px;font-weight:650;cursor:pointer;margin-top:22px;
  }
  .btn-primary:disabled{background:#B9C9C5;}
  .btn-secondary{
    width:100%;background:none;color:var(--ink-soft);border:none;
    padding:10px;font-size:14.5px;cursor:pointer;text-align:center;
  }
  .btn-danger-outline{
    background:none;border:1.5px solid var(--coral);color:var(--coral);border-radius:10px;
    padding:9px 14px;font-size:13px;font-weight:650;cursor:pointer;
  }
  .btn-outline{
    background:none;border:1.5px solid var(--teal);color:var(--teal-dark);border-radius:10px;
    padding:9px 14px;font-size:13px;font-weight:650;cursor:pointer;
  }
  .status-badge{
    display:inline-flex;align-items:center;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:650;white-space:nowrap;
  }
  .status-open{background:var(--foam);color:var(--teal-dark);}
  .status-closed{background:#E9E4D8;color:#6B6252;}
  .hero-no-photo{
    border:1.5px dashed #B9C9C5;border-radius:12px;padding:22px 14px;text-align:center;
    color:var(--ink-soft);font-size:13px;margin-bottom:12px;
  }

  .stage-title{
    display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--teal-dark);
    margin:0 0 14px 0;padding-bottom:9px;border-bottom:2px solid var(--foam-line);
  }
  .stage-num{
    width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;
  }

  .progress-row{
    display:flex;align-items:center;gap:10px;margin-top:10px;
    background:var(--surface);border-radius:12px;padding:10px 12px;
    box-shadow:0 1px 3px rgba(20,50,45,0.08);border:1px solid rgba(20,50,45,0.06);
  }
  .progress-text{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .progress-bar-track{flex:1;height:6px;border-radius:4px;background:#EFEAE0;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--teal);border-radius:4px;}

  .frasco-check{
    width:26px;height:26px;border-radius:7px;border:1.5px solid #C7BFAE;background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;
  }
  .frasco-check.checked{background:var(--teal);border-color:var(--teal);}

  .photo-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .photo-slots .photo-btn{padding:16px 6px;font-size:12px;gap:6px;}
  .photo-slots .photo-btn svg{width:22px;height:22px;}
  .photo-slots .photo-preview-wrap img{width:100%;height:104px;object-fit:cover;border-radius:12px;display:block;}
  .photo-slots .retake{padding:5px 8px;font-size:11px;top:6px;right:6px;}

  .campos-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .campo-field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:650;}
  .campo-field input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #DAD3C4;font-size:15px;background:var(--surface);}
  .campo-field input:focus{outline:none;border-color:var(--teal);}

  .summary-wrap{
    background:var(--surface);border-radius:14px;padding:4px 14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(20,50,45,0.08);border:1px solid rgba(20,50,45,0.06);
  }
  .summary-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid #EFEAE0;font-size:13.5px;
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-destino{color:var(--ink);}
  .summary-count{font-weight:700;color:var(--teal-dark);}
  .summary-total{border-top:1.5px solid var(--foam-line);margin-top:2px;padding-top:12px;}
  .summary-total .summary-destino{font-weight:700;}

  /* Location detail */
  .detail-hero{
    background:var(--surface);border-radius:16px;padding:14px;margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,50,45,0.08);
  }
  .detail-hero img{width:100%;border-radius:12px;max-height:220px;object-fit:cover;display:block;margin-bottom:12px;}
  .detail-hero .name{font-size:19px;font-weight:700;margin-bottom:6px;}
  .detail-hero .timestamp{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .detail-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}

  .section-title{
    font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;
    margin:0 0 10px 2px;display:flex;justify-content:space-between;align-items:baseline;
  }
  .section-title .count-pill{background:var(--foam);color:var(--teal-dark);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;}

  .frascos-table-wrap{
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    background:var(--surface);border-radius:14px;box-shadow:0 1px 3px rgba(20,50,45,0.08);
    border:1px solid rgba(20,50,45,0.06);
  }
  table.frascos-table{width:100%;border-collapse:collapse;font-size:13px;}
  .frascos-table th{
    background:var(--teal-dark);color:#fff;text-align:left;padding:9px 10px;
    font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;font-weight:700;
  }
  .frascos-table th:first-child{border-radius:14px 0 0 0;}
  .frascos-table td{padding:10px 10px;border-bottom:1px solid #EFEAE0;white-space:nowrap;color:var(--ink);}
  .frascos-table tr:last-child td{border-bottom:none;}
  .frascos-table td.numero-cell{font-weight:700;}
  .table-del-btn{background:none;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;padding:2px 6px;}

  /* Sticky add-frasco bar */
  .add-frasco-bar{
    position:fixed;left:0;right:0;bottom:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)) 16px;
    background:linear-gradient(to top, var(--bg) 60%, rgba(246,242,234,0));
    z-index:15;
  }
  .add-frasco-btn{
    max-width:560px;margin:0 auto;width:100%;
    background:var(--teal);color:#fff;border:none;border-radius:14px;padding:15px;
    font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 6px 16px rgba(14,107,102,0.35);cursor:pointer;
  }

  /* Quick-confirm sheet for new frasco */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(16,32,30,0.45);z-index:30;
    display:flex;align-items:flex-end;
  }
  .sheet{
    background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)) 18px;
    max-width:560px;margin:0 auto;
  }
  .sheet h3{margin:0 0 12px 0;font-size:16px;}
  .sheet img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:12px;}
  .sheet .row-btns{display:flex;gap:10px;margin-top:16px;}
  .sheet .row-btns button{flex:1;}
  .btn-ghost{background:var(--foam);color:var(--teal-dark);border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:650;cursor:pointer;}

  .gps-result{
    border:1.5px solid var(--foam-line);border-radius:12px;padding:12px 14px;background:var(--foam);
  }
  .gps-coords{font-size:15px;font-weight:700;color:var(--teal-dark);}
  .gps-accuracy{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .gps-loading{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px dashed #B9C9C5;border-radius:12px;
    color:var(--ink-soft);font-size:13.5px;
  }
  .gps-error{
    background:var(--coral-soft);color:#8A3D1E;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:8px;
  }
  .gps-link-row{margin-top:2px;}
  .gps-link{color:var(--teal-dark);font-weight:650;text-decoration:none;border-bottom:1.5px solid var(--foam-line);}

  .top-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:10px;}

  .spinner{
    width:34px;height:34px;border-radius:50%;margin:0 auto;
    border:3.5px solid var(--foam-line);border-top-color:var(--teal);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .ocr-note{
    background:var(--foam);color:var(--teal-dark);border-radius:12px;padding:11px 12px;
    font-size:13px;line-height:1.4;margin-bottom:6px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  }
  .ocr-note-warn{background:var(--coral-soft);color:#8A3D1E;}
  .ocr-retry{
    background:rgba(255,255,255,0.6);border:none;border-radius:8px;padding:6px 10px;font-size:12.5px;
    font-weight:650;color:inherit;cursor:pointer;
  }

  .footer-tools{margin-top:34px;text-align:center;}
  .footer-tools button{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px;}

  .loading-note{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:40px 0;}

  input[type=file]{display:none;}
</style>
</head>

  <div>
    <h1 id="headerTitle">Colheita de Água</h1>
    <span class="eyebrow" id="headerSub">registo de amostragem</span>
  </div>

<main id="app">
  <div class="loading-note">A carregar…</div>

<!-- OCR local e gratuito (leitura de etiquetas sem chave API) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>

<script>
/* ---------------- Storage helpers (localStorage — funciona offline, no telemóvel) ---------------- */
async function safeGet(key){
  try{
    const raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function safeSet(key,value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error('storage set failed',key,e); return false; }
}
async function safeDelete(key){
  try{ localStorage.removeItem(key); }catch(e){ /* key may not exist */ }
}

async function loadLocations(){ return (await safeGet('locations')) || []; }
async function saveLocations(list){ return await safeSet('locations', list); }

async function loadLocationNames(){
  let names = await safeGet('location-names');
  if(!names){
    names = ['Companheira','Pomarão Pontão','Pomarão Pontão+Barco'];
    await safeSet('location-names', names);
  }
  return names;
}
async function addLocationName(nome){
  const names = await loadLocationNames();
  const exists = names.some(n => n.trim().toLowerCase() === nome.trim().toLowerCase());
  if(!exists){
    names.push(nome.trim());
    await safeSet('location-names', names);
  }
}
async function loadFrascos(locId){ return (await safeGet('frascos:'+locId)) || []; }
async function saveFrascos(locId,list){ return await safeSet('frascos:'+locId, list); }

/* ---------------- Utilities ---------------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'}) + ' · ' + d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const cameraInput = document.getElementById('cameraInput');
function openCamera(maxDim, quality){
  return new Promise((resolve)=>{
    cameraInput.onchange = async (e)=>{
      const file = e.target.files[0];
      cameraInput.value = '';
      if(!file){ resolve(null); return; }
      try{
        const dataUrl = await resizeImage(file, maxDim, quality);
        resolve(dataUrl);
      }catch(err){ resolve(null); }
    };
    cameraInput.click();
  });
}

function suggestNumero(frascos){
  if(!frascos.length) return '1';
  const last = frascos[frascos.length-1].numero || '';
  const m = last.match(/^(.*?)(\d+)$/);
  if(m){
    const prefix = m[1];
    const digits = m[2].length;
    const next = (parseInt(m[2],10) + 1).toString().padStart(digits,'0');
    return prefix + next;
  }
  return String(frascos.length + 1);
}

function summarizeByDestino(frascos){
  const map = {};
  for(const f of frascos){
    const key = (f.destino && f.destino.trim()) ? f.destino.trim() : 'Sem destino definido';
    map[key] = (map[key] || 0) + 1;
  }
  return Object.entries(map).sort((a,b)=> b[1]-a[1]);
}

function buildSummaryText(loc, frascos){
  const tide = TIDES[loc.mare];
  const campos = loc.campos || {};
  const lines = [];
  lines.push(`Colheita de água — ${loc.nome}`);
  if(loc.dataRecolha) lines.push(`Data/hora: ${fmtTime(loc.dataRecolha)}`);
  if(tide) lines.push(`Maré: ${tide.label}`);
  if(loc.gps) lines.push(`Posição: ${loc.gps.lat.toFixed(5)}, ${loc.gps.lng.toFixed(5)}`);
  const camposLinhas = CAMPOS_DEF
    .filter(c => campos[c.key])
    .map(c => `${c.label}: ${campos[c.key]}`);
  if(camposLinhas.length){
    lines.push('');
    lines.push('Parâmetros de campo:');
    camposLinhas.forEach(l => lines.push(`- ${l}`));
  }
  lines.push('');
  const recolhidos = frascos.filter(f => f.recolhido).length;
  lines.push(`Total de frascos: ${frascos.length} (${recolhidos} recolhidos)`);
  lines.push('Por destino:');
  for(const [destino,count] of summarizeByDestino(frascos)){
    lines.push(`- ${destino}: ${count}`);
  }
  return lines.join('\n');
}

/* ---------------- Tide (maré) config ---------------- */
const TIDES = {
  baixa:   { label: 'Baixa-mar', cls: 'tide-baixa',   wave: waveSvg(0.25) },
  preia:   { label: 'Preia-mar', cls: 'tide-preia',   wave: waveSvg(0.85) },
  enchente:{ label: 'Enchente',  cls: 'tide-enchente',wave: waveSvg(0.55, true) },
  vazante: { label: 'Vazante',   cls: 'tide-vazante', wave: waveSvg(0.55, false, true) }
};
function waveSvg(level, rising, falling){
  const y = 12 - level*10;
  let arrow = '';
  if(rising) arrow = `<path d="M13 2 L15.5 6 L13.8 6 L13.8 10 L12.2 10 L12.2 6 L10.5 6 Z" fill="currentColor"/>`;
  if(falling) arrow = `<path d="M13 10 L15.5 6 L13.8 6 L13.8 2 L12.2 2 L12.2 6 L10.5 6 Z" fill="currentColor"/>`;
  return `<svg viewBox="0 0 26 18" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 ${y} Q 4 ${y-4}, 8 ${y} T 16 ${y} T 24 ${y}" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    ${arrow}
  </svg>`;
}

  document.querySelectorAll('#nameChips .name-chip[data-name]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#nameChips .name-chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      locNomeInput.value = chip.dataset.name;
      locNomeInput.style.display = 'none';
    });
  });
  document.getElementById('addNewChip').addEventListener('click', ()=>{

    locNomeInput.style.display = 'block';

  document.querySelectorAll('#tideOptions .tide-option').forEach(opt=>{

      opt.classList.add('selected');
      selectedTide = opt.dataset.key;
    });
  });

  document.getElementById('cancelLocBtn').addEventListener('click', ()=>{
    existingLoc ? renderLocationDetail(existingLoc.id) : renderList();
  });

  document.getElementById('saveLocBtn').addEventListener('click', async ()=>{
    const nome = document.getElementById('locNome').value.trim();
    if(!nome){ document.getElementById('locNome').focus(); return; }
    const btn = document.getElementById('saveLocBtn');
    btn.disabled = true; btn.textContent = 'A guardar…';
    const locations = await loadLocations();
    await addLocationName(nome);

    if(existingLoc){
      const idx = locations.findIndex(l => l.id === existingLoc.id);
      if(idx >= 0){
        locations[idx] = { ...locations[idx], nome, mare: selectedTide };
        await saveLocations(locations);
      }
      renderLocationDetail(existingLoc.id);
    } else {
      const newLoc = {
        id: uid(),
        nome,
        mare: selectedTide,
        fotos: [],
        gps: null,
        campos: {},
        dataRecolha: null,
        estado: 'aberto',
        timestamp: Date.now()

      await saveFrascos(newLoc.id, []);
      renderLocationDetail(newLoc.id);

/* ---------- Generic partial update ---------- */
async function updateLocationField(locId, patch){
  const locations = await loadLocations();
  const idx = locations.findIndex(l => l.id === locId);
  if(idx < 0) return null;
  locations[idx] = { ...locations[idx], ...patch };
  await saveLocations(locations);
  return locations[idx];
}

/* ---------- GPS (Recolha, página de detalhe — grava direto e define a data/hora) ---------- */
function renderDetailGps(loc){
  const area = document.getElementById('gpsArea');
  if(!area) return;
  if(loc.gps){
    area.innerHTML = `
      <div class="gps-result">
        <div class="gps-coords mono">${loc.gps.lat.toFixed(6)}, ${loc.gps.lng.toFixed(6)}</div>
        <div class="gps-accuracy">precisão ±${Math.round(loc.gps.accuracy)} m</div>
        <button class="retake" id="retryGpsBtn" style="position:static;margin-top:8px;">Atualizar posição</button>
      </div>`;
    document.getElementById('retryGpsBtn').addEventListener('click', ()=> requestDetailGps(loc.id));
  } else {
    area.innerHTML = `
      <button class="photo-btn" id="getGpsBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
        Obter posição GPS
      </button>`;
    document.getElementById('getGpsBtn').addEventListener('click', ()=> requestDetailGps(loc.id));
  }
}
function requestDetailGps(locId){
  const area = document.getElementById('gpsArea');
  if(!area) return;
  area.innerHTML = `<div class="gps-loading"><div class="spinner" style="width:20px;height:20px;border-width:2.5px;"></div><span>A obter posição…</span></div>`;
  if(!navigator.geolocation){
    area.innerHTML = `<div class="gps-error">GPS não suportado neste navegador.</div>`;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos)=>{
      const gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      const locations = await loadLocations();
      const current = locations.find(l => l.id === locId);
      const dataRecolha = (current && current.dataRecolha) || pos.timestamp || Date.now();
      const updated = await updateLocationField(locId, { gps, dataRecolha });
      renderDetailGps(updated);
      const dtEl = document.getElementById('dataRecolhaDisplay');
      if(dtEl) dtEl.textContent = fmtTime(updated.dataRecolha);
    },
    (err)=>{
      area.innerHTML = `
        <div class="gps-error">Não foi possível obter a posição (${esc(err.message)}).</div>
        <button class="btn-secondary" id="retryGpsBtn2" style="padding:8px 0;">Tentar novamente</button>`;
      document.getElementById('retryGpsBtn2').addEventListener('click', ()=> requestDetailGps(locId));
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function wireCamposInputs(loc){

    input.addEventListener('change', async ()=>{
      const locations = await loadLocations();
      const current = locations.find(l => l.id === loc.id);
      const campos = { ...(current ? current.campos : {}), [c.key]: input.value.trim() };
      await updateLocationField(loc.id, { campos });
    });
  });
}

    const idx = all.findIndex(l => l.id === locId);
    if(idx < 0) return;
    all[idx].estado = isClosed ? 'aberto' : 'fechado';
    await saveLocations(all);
    renderLocationDetail(locId);
  });

  document.getElementById('delLocBtn').addEventListener('click', async ()=>{
    if(!confirm(`Eliminar "${loc.nome}" e todos os frascos associados? Esta ação não pode ser desfeita.`)) return;
    const updated = locations.filter(l => l.id !== locId);
    await saveLocations(updated);
    await safeDelete('frascos:'+locId);
    renderList();
  });

  document.querySelectorAll('.frasco-del').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const fid = btn.dataset.id;
      if(!confirm('Eliminar este frasco?')) return;
      const list = await loadFrascos(locId);
      await saveFrascos(locId, list.filter(f => f.id !== fid));
      renderLocationDetail(locId);
    });
  });

  if(isClosed){
    removeAddFrascoBar();
  } else {
    renderAddFrascoBar(locId, frascos);
  }
}

function renderAddFrascoBar(locId, frascos){
  let bar = document.getElementById('addFrascoBar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'addFrascoBar';
    bar.className = 'add-frasco-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `
    <button class="add-frasco-btn" id="addFrascoBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="white" stroke-width="1.8"/><circle cx="12" cy="13" r="3.4" stroke="white" stroke-width="1.8"/></svg>
      Ler etiqueta do frasco
    </button>
    <button class="btn-secondary" id="manualFrascoBtn" style="max-width:560px;margin:4px auto 0 auto;display:block;">Preencher manualmente</button>`;
  document.getElementById('addFrascoBtn').addEventListener('click', ()=> startAddFrasco(locId));
  document.getElementById('manualFrascoBtn').addEventListener('click', ()=> startAddFrasco(locId, true));
}
function removeAddFrascoBar(){
  const bar = document.getElementById('addFrascoBar');
  if(bar) bar.remove();
}

async function loadKnownList(key){ return (await safeGet(key)) || []; }
async function addKnownValue(key, value){
  if(!value) return;
  const list = await loadKnownList(key);
  const exists = list.some(v => v.trim().toLowerCase() === value.trim().toLowerCase());
  if(!exists){
    list.push(value.trim());
    await safeSet(key, list);
  }
}

async function startAddFrasco(locId, skipCamera){
  const frascos = await loadFrascos(locId);
  const suggestedNumero = suggestNumero(frascos);
  const suggestedDestino = frascos.length ? (frascos[frascos.length-1].destino || '') : '';
  const suggestedAmostra = frascos.length ? (frascos[frascos.length-1].amostra || '') : '';
  const params = await loadKnownList('known-params');
  const destinos = await loadKnownList('known-destinos');

  let extracted = null;
  let ocrAttempted = false;
  let ocrEngine = null;

  if(!skipCamera){
    const photo = await openCamera(1300, 0.82);
    if(!photo) return;
    ocrAttempted = true;
    const apiKey = getApiKey();
    if(apiKey){
      ocrEngine = 'ia';
      showOcrLoading('A consultar a IA…');
      extracted = await extractFrascoFields(photo, apiKey);
    } else {
      ocrEngine = 'local';
      showOcrLoading('A ler a etiqueta no telemóvel (pode demorar alguns segundos)…');
      extracted = await extractFrascoFieldsLocalOCR(photo);
    }
    hideOcrLoading();
  }

  showFrascoSheet(locId, {
    suggestedNumero: (extracted && extracted.numero) || suggestedNumero,
    suggestedDestino: (extracted && extracted.destino) || suggestedDestino,
    suggestedAmostra: (extracted && extracted.amostra) || suggestedAmostra,
    suggestedParam: (extracted && extracted.frasco) || '',
    params, destinos,
    ocrAttempted, ocrFailed: ocrAttempted && !extracted, ocrEngine
  });
}

function showOcrLoading(message){
  const el = document.createElement('div');
  el.className = 'sheet-backdrop';
  el.id = 'ocrLoading';
  el.innerHTML = `
    <div class="sheet" style="text-align:center;padding-top:30px;padding-bottom:30px;">
      <div class="spinner"></div>
      <p style="margin-top:14px;color:var(--ink-soft);font-size:14.5px;">${esc(message || 'A ler a etiqueta…')}</p>
    </div>`;
  document.body.appendChild(el);
}
function hideOcrLoading(){
  const el = document.getElementById('ocrLoading');
  if(el) el.remove();
}

function getApiKey(){
  try{ return (localStorage.getItem('anthropic-api-key') || '').trim(); }
  catch(e){ return ''; }
}
function setApiKey(key){
  try{ localStorage.setItem('anthropic-api-key', key.trim()); return true; }
  catch(e){ return false; }
}

async function extractFrascoFields(dataUrl, apiKey){
  const match = dataUrl.match(/^data:(image\/\w+);base64,(.*)$/);
  if(!match) return null;
  const mediaType = match[1];
  const base64Data = match[2];
  const systemPrompt = 'Vais receber uma foto da etiqueta de um frasco de amostragem de água. As etiquetas costumam ter uma linha de tabela com os campos "Frasco:" (tipo/parâmetro do frasco), "n°:" (número do frasco) e "Destino:" (laboratório de destino), e um campo separado "N° amostra:" (número da amostra, geralmente maior, no topo). Extrai estes quatro valores: "frasco", "numero", "destino", "amostra". Responde APENAS com um objeto JSON válido com essas quatro chaves, todas strings (usa "" se não conseguires ler algum campo). Não incluas texto antes ou depois do JSON, nem blocos de código.';
  try{
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        system: systemPrompt,
        messages: [
          { role: 'user', content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64Data } },
            { type: 'text', text: 'Lê e extrai os campos da etiqueta nesta foto.' }
          ]}
        ]
      })
    });
    if(!response.ok) return null;
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) return null;
    const clean = textBlock.text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    return parsed;
  }catch(e){
    console.error('Falha na leitura automática da etiqueta', e);
    return null;
  }
}

/* ---------- Leitura local e gratuita (OCR no telemóvel, sem chave API) ---------- */
async function extractFrascoFieldsLocalOCR(dataUrl){
  if(typeof Tesseract === 'undefined'){
    console.error('Tesseract.js não carregou (sem ligação à internet?).');
    return null;
  }
  try{
    const result = await Tesseract.recognize(dataUrl, 'por');
    const text = (result && result.data && result.data.text) || '';
    return parseAguasAlgarveLabel(text);
  }catch(e){
    console.error('OCR local falhou', e);
    return null;
  }
}

/* Interpreta o texto lido pelo OCR, ajustado ao modelo de etiqueta
   "Águas do Algarve": uma linha de tabela com "Frasco: ... n°: ... Destino: ..."
   e um campo separado "N° amostra: ..." — mas com fallback campo a campo
   caso a linha completa não seja reconhecida de uma vez. */
function parseAguasAlgarveLabel(text){
  const norm = text.replace(/\s+/g, ' ').trim();
  if(!norm) return null;
  const out = { frasco: '', numero: '', destino: '', amostra: '' };

  const amostraMatch = norm.match(/N[°ºo]?\s*amostra[:\s]*([0-9]{4,})/i);
  if(amostraMatch) out.amostra = amostraMatch[1];

  // tenta a linha completa da tabela de uma vez (mais fiável quando resulta)
  const rowMatch = norm.match(/Frasco[:\s]*([\s\S]*?)\s*n[°ºo][:\s]*([0-9]+)\s*Destino[:\s]*([^\n]+?)(?=\s*Obs\b|$)/i);
  if(rowMatch){
    out.frasco = rowMatch[1].trim();
    out.numero = rowMatch[2].trim();
    out.destino = rowMatch[3].trim();
  } else {
    const frascoMatch = norm.match(/Frasco[:\s]*([^\n]+?)(?=\s*n[°ºo][:\s]|$)/i);
    if(frascoMatch) out.frasco = frascoMatch[1].trim();
    const numeroMatch = norm.match(/\bn[°ºo][:\s]*([0-9]+)\b/i);
    if(numeroMatch) out.numero = numeroMatch[1].trim();
    const destinoMatch = norm.match(/Destino[:\s]*([^\n]+?)(?=\s*Obs\b|$)/i);
    if(destinoMatch) out.destino = destinoMatch[1].trim();
  }

  // limpar sobras comuns de OCR ruidoso no fim do destino (ex.: apanhar "Obs" a mais)
  out.destino = out.destino.replace(/\s*Obs.*$/i, '').trim();

  const hasAny = out.frasco || out.numero || out.destino || out.amostra;
  return hasAny ? out : null;
}

function chipsRow(id, values){
  if(!values.length) return `<div class="name-chips" id="${id}"></div>`;
  return `<div class="name-chips" id="${id}">
    ${values.map(v => `<div class="name-chip" data-value="${esc(v)}">${esc(v)}</div>`).join('')}
  </div>`;
}
function wireChipRow(root, containerId, inputEl){
  root.querySelectorAll(`#${containerId} .name-chip`).forEach(chip=>{
    chip.addEventListener('click', ()=>{
      inputEl.value = chip.dataset.value;
      inputEl.focus();
    });
  });
}

function showFrascoSheet(locId, opts){
  const { suggestedNumero, suggestedDestino, suggestedAmostra, suggestedParam, params, destinos, ocrAttempted, ocrFailed, ocrEngine } = opts;
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <h3>Novo frasco</h3>
      ${ocrAttempted ? `
        <div class="ocr-note ${ocrFailed ? 'ocr-note-warn' : ''}">
          ${ocrFailed
            ? 'Não consegui ler a etiqueta automaticamente. Preenche os campos abaixo.'
            : (ocrEngine === 'local'
              ? 'Campos lidos localmente no telemóvel (OCR grátis) — confirma ou corrige antes de guardar.'
              : 'Campos lidos pela IA — confirma ou corrige antes de guardar.')}
          <button class="ocr-retry" id="rereadBtn">🔁 Reler etiqueta</button>
        </div>` : ''}

      <label class="field-label" style="margin-top:0;">Frasco (parâmetro a analisar)</label>
      ${chipsRow('paramChips', params)}
      <input type="text" id="frascoParam" placeholder="Ex.: Cloretos, pH, Metais..." value="${esc(suggestedParam || '')}">

      <label class="field-label">Nº</label>
      <input type="text" id="frascoNumero" value="${esc(suggestedNumero)}">

      <label class="field-label">Destino</label>
      ${chipsRow('destinoChips', destinos)}
      <input type="text" id="frascoDestino" placeholder="Ex.: Laboratório X" value="${esc(suggestedDestino)}">

      <label class="field-label">Nº Amostra</label>
      <input type="text" id="frascoAmostra" placeholder="Ex.: 24" value="${esc(suggestedAmostra)}">

      <button class="btn-primary" id="saveFrascoBtn">Guardar frasco</button>
      <button class="btn-secondary" id="cancelFrascoBtn">Cancelar</button>
    </div>`;
  document.body.appendChild(backdrop);

  const paramInput = backdrop.querySelector('#frascoParam');
  const numInput = backdrop.querySelector('#frascoNumero');
  const destinoInput = backdrop.querySelector('#frascoDestino');
  const amostraInput = backdrop.querySelector('#frascoAmostra');

  wireChipRow(backdrop, 'paramChips', paramInput);
  wireChipRow(backdrop, 'destinoChips', destinoInput);

  setTimeout(()=>{ paramInput.focus(); }, 50);

  const rereadBtn = backdrop.querySelector('#rereadBtn');
  if(rereadBtn){
    rereadBtn.addEventListener('click', async ()=>{
      const photo = await openCamera(1300, 0.82);
      if(!photo) return;
      backdrop.remove();
      const apiKey = getApiKey();
      let extracted, ocrEngine;
      if(apiKey){
        ocrEngine = 'ia';
        showOcrLoading('A consultar a IA…');
        extracted = await extractFrascoFields(photo, apiKey);
      } else {
        ocrEngine = 'local';
        showOcrLoading('A ler a etiqueta no telemóvel (pode demorar alguns segundos)…');
        extracted = await extractFrascoFieldsLocalOCR(photo);
      }
      hideOcrLoading();
      showFrascoSheet(locId, {
        suggestedNumero: (extracted && extracted.numero) || numInput.value,
        suggestedDestino: (extracted && extracted.destino) || destinoInput.value,
        suggestedAmostra: (extracted && extracted.amostra) || amostraInput.value,
        suggestedParam: (extracted && extracted.frasco) || paramInput.value,
        params, destinos, ocrAttempted: true, ocrFailed: !extracted, ocrEngine
      });
    });
  }

  backdrop.querySelector('#cancelFrascoBtn').addEventListener('click', ()=> backdrop.remove());

  backdrop.querySelector('#saveFrascoBtn').addEventListener('click', async ()=>{
    const frasco = paramInput.value.trim();
    const numero = numInput.value.trim();
    if(!frasco){ paramInput.focus(); return; }
    if(!numero){ numInput.focus(); return; }
    const destino = destinoInput.value.trim();
    const amostra = amostraInput.value.trim();
    const saveBtn = backdrop.querySelector('#saveFrascoBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'A guardar…';
    const frascos = await loadFrascos(locId);
    frascos.push({ id: uid(), frasco, numero, destino, amostra, recolhido: false, timestamp: Date.now() });
    await saveFrascos(locId, frascos);
    await addKnownValue('known-params', frasco);
    await addKnownValue('known-destinos', destino);
    backdrop.remove();
    renderLocationDetail(locId);
  });
}

async function resetAllData(){
  if(!confirm('Isto apaga TODOS os locais e frascos guardados neste dispositivo. Continuar?')) return;
  const locations = await loadLocations();
  for(const loc of locations){ await safeDelete('frascos:'+loc.id); }
  await saveLocations([]);
  renderList();
}

/* ---------- Settings ---------- */
function renderSettings(){
  view = 'settings';
  removeAddFrascoBar();
  backBtn.style.visibility = 'visible';
  headerTitle.textContent = 'Definições';
  headerSub.textContent = 'chave API e cópia de segurança';
  ensureFab();

  const currentKey = getApiKey();

  app.innerHTML = `
    <label class="field-label" style="margin-top:0;">Cópia de segurança</label>
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:0;">
      Todos os dados ficam guardados só neste telemóvel. Usa "Guardar cópia" para exportar tudo
      (locais, frascos, fotos, GPS) para um ficheiro, e envia-o para o Google Drive através da
      partilha do iPhone. "Importar cópia" traz esses dados de volta, neste ou noutro telemóvel.
    </p>
    <button class="btn-primary" id="exportBtn">📤 Guardar cópia (Drive / Ficheiros)</button>
    <button class="btn-secondary" id="importBtn">📥 Importar cópia</button>
    <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">

    <label class="field-label">Leitura automática de etiquetas</label>
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:0;">
      Por omissão, a app lê as etiquetas com OCR local (Tesseract), <strong>grátis e sem chave</strong> —
      corre no telemóvel, mas é menos preciso com letra manuscrita ou fotos de má qualidade.
      Se quiseres leitura mais fiável (usa IA), define uma chave da Anthropic abaixo — nesse caso,
      cada leitura consome créditos da tua conta.
    </p>
    <input type="text" id="apiKeyInput" placeholder="sk-ant-... (opcional)" value="${esc(currentKey)}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:8px;">
      Podes criar uma chave em <strong>console.anthropic.com</strong> (secção "API Keys").
      A chave fica guardada apenas neste dispositivo.
    </p>
    <button class="btn-primary" id="saveKeyBtn">Guardar chave</button>
    ${currentKey ? `<button class="btn-secondary" id="clearKeyBtn">Remover chave guardada</button>` : ''}
  `;

  document.getElementById('exportBtn').addEventListener('click', shareBackup);
  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFileInput').click();
  });
  document.getElementById('importFileInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const text = await file.text();
      const backup = JSON.parse(text);
      if(!backup || !Array.isArray(backup.locations)){
        alert('Este ficheiro não parece ser uma cópia de segurança válida.');
        return;
      }
      if(!confirm(`Isto substitui TODOS os dados atuais por ${backup.locations.length} local(is) deste ficheiro. Continuar?`)) return;
      await restoreBackup(backup);
      alert('Cópia importada com sucesso.');
      renderList();
    }catch(err){
      alert('Não foi possível ler este ficheiro.');
    }
  });

  document.getElementById('saveKeyBtn').addEventListener('click', ()=>{
    const val = document.getElementById('apiKeyInput').value.trim();
    setApiKey(val);
    renderList();
  });
  const clearBtn = document.getElementById('clearKeyBtn');
  if(clearBtn){
    clearBtn.addEventListener('click', ()=>{
      setApiKey('');
      renderSettings();
    });
  }
}

/* ---------- Backup / restore (Drive via share sheet, or manual file) ---------- */
async function buildBackupObject(){
  const locations = await loadLocations();
  const frascosByLocation = {};
  for(const loc of locations){
    frascosByLocation[loc.id] = await loadFrascos(loc.id);
  }
  const locationNames = await loadLocationNames();
  const knownParams = await loadKnownList('known-params');
  const knownDestinos = await loadKnownList('known-destinos');
  return {
    version: 1,
    exportedAt: Date.now(),
    locations,
    frascosByLocation,
    locationNames,
    knownParams,
    knownDestinos
  };
}

async function shareBackup(){
  const btn = document.getElementById('exportBtn');
  const original = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'A preparar…'; }

  const backup = await buildBackupObject();
  const json = JSON.stringify(backup, null, 2);
  const filename = `colheita-agua-backup-${new Date().toISOString().slice(0,10)}.json`;

  if(btn){ btn.disabled = false; btn.textContent = original; }

  try{
    const file = new File([json], filename, { type: 'application/json' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Colheita de Água — cópia de segurança' });
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return; // utilizador cancelou a partilha
  }

  // fallback: descarregar o ficheiro diretamente
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 5000);
}

async function restoreBackup(backup){
  await saveLocations(backup.locations || []);
  const frascosByLocation = backup.frascosByLocation || {};
  for(const locId of Object.keys(frascosByLocation)){
    await saveFrascos(locId, frascosByLocation[locId]);
  }
  if(Array.isArray(backup.locationNames)) await safeSet('location-names', backup.locationNames);
  if(Array.isArray(backup.knownParams)) await safeSet('known-params', backup.knownParams);
  if(Array.isArray(backup.knownDestinos)) await safeSet('known-destinos', backup.knownDestinos);
}

renderList = async function(){ removeAddFrascoBar(); await _origRenderList(); };

renderList();

    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* offline caching indisponível */ });
  });
}
